# Netlify site 1: the public landing and contact pages. Base directory on Netlify: web
#
# ▶ Replace the two addresses below with yours:
#     reachout-api.onrender.com  → your Render service address
#     reachout-app.netlify.app   → your app's Netlify address
# ▶ In Netlify → Site configuration → Environment variables, add NETLIFY_PROXY_SECRET
#   (the same value as on Render and on the app site).

[build]
  command = "node netlify-build.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"
  APP_URL = "https://reachout-app.netlify.app"
  # Shown on the privacy policy and terms pages.
  OPERATOR_NAME = "the Reachout team"
  JURISDICTION = "India"

# The contact form and the enquiry pop-up post to the API; forwarded behind the scenes and signed.
[[redirects]]
  from = "/api/*"
  to = "https://reachout-api.onrender.com/api/:splat"
  status = 200
  force = true
  signed = "NETLIFY_PROXY_SECRET"

